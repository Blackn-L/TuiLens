name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # setup-node v7 不再为 registry-url 注入占位 token；整个 job 的 npm 调用统一使用发布 token。
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - name: Run coverage gate
        run: npm run test:coverage
        env:
          TUILENS_HOME: ${{ runner.temp }}/tuilens
      - run: npm run smoke:install
      - run: npm run release:check
      - name: Publish npm package
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "tuilens@$version" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "tuilens@$version is already published; skipping npm publish"
          else
            npm publish --provenance --access public
          fi
      - name: Create GitHub release
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
