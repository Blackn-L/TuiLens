name: Checks
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      # 测试输出统一落到 TUILENS_HOME 与 artifacts/，失败时仍要归档截图与 diff。
      - name: Run tests
        id: tests
        run: npm test
        env:
          TUILENS_HOME: ${{ runner.temp }}/tuilens
        continue-on-error: true
      - name: Upload failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tuilens-evidence-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            artifacts/
            ${{ runner.temp }}/tuilens/
          if-no-files-found: ignore
          retention-days: 14
      # 上一步保留证据后，这里重新以测试退出码结束任务，避免把失败当成通过。
      - name: Enforce test result
        if: steps.tests.outcome == 'failure'
        run: exit 1

  perf:
    # 性能基线比较只在固定环境中运行：不同 runner 的 CPU 会让绝对耗时不具可比性。
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run performance scenario
        run: node dist/src/interfaces/cli.js perf --file examples/perf.json
          --baseline perf/baseline.json --junit artifacts/junit-perf.xml
        env:
          TUILENS_HOME: ${{ runner.temp }}/tuilens
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tuilens-perf-${{ github.run_attempt }}
          path: |
            artifacts/
            ${{ runner.temp }}/tuilens/
          if-no-files-found: ignore
          retention-days: 30
