name: Scheduled soak
on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: mkdir -p artifacts
      - name: Run bounded soak
        run: npm --silent run soak > artifacts/soak.json
        env:
          TUILENS_SOAK_FRAMES: '2000'
          TUILENS_HOME: ${{ runner.temp }}/tuilens
      - name: Capture dependency drift
        run: |
          npm outdated --json > artifacts/outdated.json || true
          npm view node-pty dist-tags --json > artifacts/node-pty-dist-tags.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tuilens-soak-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 30
