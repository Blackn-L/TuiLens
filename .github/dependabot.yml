version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      stable-dependencies:
        patterns:
          - '*'
        exclude-patterns:
          - node-pty
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
